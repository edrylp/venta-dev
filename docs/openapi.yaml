openapi: 3.0.3
info:
  title: Venta API
  version: 1.0.0
  description: |-
    REST API for **Venta**, a C2C marketplace for used PC components in the Philippines. Every listing has a hardware category, a price in PHP, a location and 1 to 10 photos, and goes live only after an admin approves it. Buyers and sellers contact each other through one conversation per listing.

    ### Authentication

    Log in or register to get a JWT, then send it as `Authorization: Bearer <token>`. Logging out revokes the token server-side, and changing the password invalidates all older tokens. There are two roles, `user` (can both buy and sell) and `admin` (seeded, never self-registered). A user's email is never shown to other users.

    ### Conventions

    - Success: `{ "success": true, "data": ... }`. List endpoints that paginate add a sibling `pagination` object.
    - Error: `{ "success": false, "message": "..." }`.
    - Photos are uploaded straight to S3 with pre-signed URLs, so image bytes never pass through this API.
    - Ids are 24-character hex ObjectIds. Timestamps are ISO 8601.

    ### Listing lifecycle

    | Status | Public? | Next |
    | --- | --- | --- |
    | `pending` | No | `available` or `rejected` (admin) |
    | `available` | Yes | `sold`, or back to `pending` if edited |
    | `rejected` | No | back to `pending` when the seller edits |
    | `sold` | No (owner and admin only) | final |

    Listings that are not `available` return `404` to everyone except their owner and admins.
servers:
- url: http://localhost:5000/api
  description: Local development
- url: https://{apiId}.execute-api.{region}.amazonaws.com/api
  description: AWS API Gateway (Lambda)
  variables:
    apiId:
      default: your-api-id
    region:
      default: ap-southeast-1
tags:
- name: Health
  description: Confirms the API is running.
- name: Auth
  description: Register, log in, change password and log out.
- name: Uploads
  description: Pre-signed S3 URLs for listing photos.
- name: Listings
  description: Browse, create, edit, mark sold and delete listings.
- name: Admin
  description: Review the pending queue. Admin only.
- name: Conversations
  description: Buyer-seller messaging about a listing.
security:
- bearerAuth: []
paths:
  /health:
    get:
      tags:
      - Health
      operationId: getHealth
      summary: Health check
      description: Confirms the API is running.
      security: []
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
              example:
                success: true
                data:
                  status: ok
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: Register
      description: |-
        Creates an account. The role is always `user`; it cannot be set by the client. Returns the new user and a JWT.

        Registration tells the caller when an email or username is already taken (an accepted trade-off, because the user needs to know).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: ventauser
              email: ventauser@example.com
              password: password1234
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/AuthResult'
              example:
                success: true
                data:
                  user:
                    _id: 665f1c2a9b1e4d0012a3b4a2
                    username: ventauser
                    email: ventauser@example.com
                    role: user
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example-payload.example-signature
        '400':
          description: Validation failed. Non-string values are rejected too (for example an object or array in place of a string).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                usernameTooShort:
                  summary: Username too short
                  value:
                    success: false
                    message: Username must be at least 4 characters
                usernameTooLong:
                  summary: Username too long
                  value:
                    success: false
                    message: The username field must not be greater than 15 characters
                usernameNotString:
                  summary: Non-string username
                  value:
                    success: false
                    message: The username field must be a string
                passwordNotString:
                  summary: Non-string password
                  value:
                    success: false
                    message: The password field must be a string
        '409':
          description: Email or username already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                duplicateEmail:
                  summary: Duplicate email
                  value:
                    success: false
                    message: Email already registered.
                duplicateUsername:
                  summary: Duplicate username
                  value:
                    success: false
                    message: Username has already been taken.
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Log in
      description: |-
        Logs in with email and password and returns the user and a JWT.

        An unknown email and a wrong password return the same `401` message, so the API does not reveal which emails are registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ventauser@example.com
              password: password1234
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/AuthResult'
              example:
                success: true
                data:
                  user:
                    _id: 665f1c2a9b1e4d0012a3b4a2
                    username: ventauser
                    email: ventauser@example.com
                    role: user
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example-payload.example-signature
        '400':
          description: Non-string `email` or `password`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emailNotString:
                  summary: Non-string email
                  value:
                    success: false
                    message: The email field must be a string
                passwordNotString:
                  summary: Non-string password
                  value:
                    success: false
                    message: The password field must be a string
        '401':
          description: Wrong password or unknown email (same message for both).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Invalid email or password
  /auth/password:
    patch:
      tags:
      - Auth
      operationId: changePassword
      summary: Change password
      description: |-
        Changes the password of the logged-in user and returns a fresh token.

        ### Response

        `200` with `data.user` and a new `data.token`, so the current session continues.

        ### Errors

        | Status | When |
        | --- | --- |
        | `400` | Wrong `currentPassword` (deliberately not `401`, so the frontend's 401 handler does not log the user out) |
        | `400` | `newPassword` shorter than 8, longer than 72, or equal to `currentPassword` |
        | `401` | Missing, invalid or revoked token |

        ### How old tokens stop working

        The server records `passwordChangedAt`. Any token issued before that moment is rejected with `401` ("Password recently changed"). This is separate from logout, which revokes a single token through the `RevokedToken` collection.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: password1234
              newPassword: newpassword1234
      responses:
        '200':
          description: Password changed. A fresh token is returned so the current session continues.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/AuthResult'
              example:
                success: true
                data:
                  user:
                    _id: 665f1c2a9b1e4d0012a3b4a2
                    username: ventauser
                    email: ventauser@example.com
                    role: user
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example-payload.example-signature
        '400':
          description: Validation failed, or `currentPassword` is wrong. (A wrong current password is deliberately `400`, not `401`, so the frontend does not log the user out.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooShort:
                  summary: New password too short
                  value:
                    success: false
                    message: New password must be at least 8 characters
                tooLong:
                  summary: New password too long
                  value:
                    success: false
                    message: New password cannot exceed 72 characters
                samePassword:
                  summary: Same as current password
                  value:
                    success: false
                    message: New password cannot be the same as the current password
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Log out
      description: |-
        Logs out the current user by revoking the token used for this request.

        ### Response

        `200` with `data.message`. The token's `jti` and expiry are stored in the `RevokedToken` collection, and the token stops working immediately.

        ### Notes
        - A revoked token returns `401` ("This token has been revoked") on every protected route. That includes a second logout with the same token (logout is not idempotent by design).
        - A token issued before a password change returns a different `401` ("Password recently changed").
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Token revoked.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    required:
                    - message
                    properties:
                      message:
                        type: string
              example:
                success: true
                data:
                  message: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
  /uploads/presign:
    post:
      tags:
      - Uploads
      operationId: presignUploads
      summary: Get pre-signed upload URLs
      description: |-
        Generates pre-signed S3 upload URLs, so photos go straight from the browser to S3 and AWS credentials never reach the client.

        ### Upload flow

        1. Call this endpoint with each file's content type and size (1 to 10 files, JPEG, PNG or WebP, at most 5 MB each).
        2. `PUT` each file to its `uploadUrl` (this goes to S3, not to this API). The `Content-Type` header and the file size must match what you declared, because both are signed. Otherwise S3 rejects the upload with `403`.
        3. Submit the returned `key` values when creating or editing a listing.

        ### Notes

        - The server chooses the key, under your own `listings/<userId>/` prefix. URLs expire after 5 minutes.
        - The size limit is enforced three ways: the browser checks first, this endpoint rejects any declared size over 5 MB, and S3 rejects an upload whose size differs from the signed one.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
            example:
              files:
              - contentType: image/jpeg
                size: 482113
              - contentType: image/webp
                size: 215004
      responses:
        '200':
          description: One entry per file, in the same order as the request.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PresignedUpload'
              example:
                success: true
                data:
                - key: listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  uploadUrl: https://venta-uploads.s3.ap-southeast-1.amazonaws.com/listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=<access-key-id>%2F<date>%2Fap-southeast-1%2Fs3%2Faws4_request&X-Amz-Date=<timestamp>&X-Amz-Expires=300&X-Amz-Signature=<signature>&X-Amz-SignedHeaders=content-length%3Bcontent-type%3Bhost&x-id=PutObject
        '400':
          description: Invalid type, no files, more than 10 files, or a file over 5 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidType:
                  summary: Invalid file type
                  value:
                    success: false
                    message: Only JPEG, PNG, or WebP photos are allowed
                tooMany:
                  summary: More than 10 photos
                  value:
                    success: false
                    message: You can upload at most 10 photos
                noFiles:
                  summary: No photos
                  value:
                    success: false
                    message: Please add at least 1 photo
                tooLarge:
                  summary: File over 5 MB
                  value:
                    success: false
                    message: Each photo must be 5 MB or smaller
        '401':
          $ref: '#/components/responses/Unauthorized'
  /listings:
    get:
      tags:
      - Listings
      operationId: browseListings
      summary: Browse listings
      description: |-
        Returns the public listings (only `available`), filtered, sorted and paginated.

        ### Response

        `200` with `data` (array of listings) and a sibling `pagination` object: `{ page, limit, total, totalPages }`. Each item has `_id`, `userId` (populated as `{ _id, username }`), `category`, `title`, `price`, `location`, `images`, `imageUrls`, `status` and timestamps. List items omit `description` and `rejectionReason`.

        No matches, or a page past the end, returns `200` with `data: []`.

        ### Notes
        - Unknown query parameters are ignored. This includes `q[$gt]`, which arrives as a flat unknown key and is dropped.
        - Invalid `category`, out-of-range `page` or `limit`, empty-string parameters, or a non-string `q` return `400`.
        - The seller's email is never returned.
      security: []
      parameters:
      - name: category
        in: query
        schema:
          $ref: '#/components/schemas/Category'
        description: Filter by category.
      - name: q
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: Keyword search on title and description.
        example: rtx 3060
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - newest
          - price_asc
          - price_desc
          default: newest
        description: Sort order. Ties are broken by `_id`, so paging is stable.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: Available listings. `pagination` is a sibling of `data`. No matches, or a page past the end, returns an empty `data` array.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - pagination
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListingSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                success: true
                data:
                - _id: 665f1c2a9b1e4d0012a3b4c5
                  category: GPU
                  title: ASUS GeForce RTX 4070 Ti 12GB STRIX OC
                  price: 40000
                  location: Makati City
                  images:
                  - listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  imageUrls:
                  - https://venta-uploads.s3.ap-southeast-1.amazonaws.com/listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  status: available
                  createdAt: '2026-11-22T06:55:22.163Z'
                  updatedAt: '2026-11-22T07:20:31.203Z'
                  userId:
                    _id: 665f1c2a9b1e4d0012a3b4a1
                    username: ventaseller
                - _id: 665f1c2a9b1e4d0012a3b4c6
                  category: Processor
                  title: Ryzen 5 7600X
                  price: 8500
                  location: Pasig City
                  images:
                  - listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  imageUrls:
                  - https://venta-uploads.s3.ap-southeast-1.amazonaws.com/listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  status: available
                  createdAt: '2026-11-22T06:55:22.163Z'
                  updatedAt: '2026-11-22T07:20:31.203Z'
                  userId:
                    _id: 665f1c2a9b1e4d0012a3b4a1
                    username: ventaseller
                pagination:
                  page: 1
                  limit: 20
                  total: 21
                  totalPages: 2
        '400':
          description: Invalid query parameter (category, page, limit, or a non-string `q`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCategory:
                  summary: Invalid category
                  value:
                    success: false
                    message: The selected category is invalid
                limitTooBig:
                  summary: Limit out of range
                  value:
                    success: false
                    message: The limit field must not be greater than 50
    post:
      tags:
      - Listings
      operationId: createListing
      summary: Create a listing
      description: |-
        Creates a listing. It always starts as `pending` and is not public until an admin approves it.

        ### Response

        `201` with the new listing (`status: "pending"`, `rejectionReason: null`) and `imageUrls` built from the stored keys.

        ### Notes
        - Only the documented fields are used. `status`, `role` and any other extra field are dropped, so a client cannot set its own status.
        - Validation failures return `400`. A missing or invalid token returns `401`.
        - The server checks that keys are inside your prefix, not that the object actually exists in S3 (known limitation).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingCreate'
            example:
              category: Processor
              title: Intel Core Ultra 5 250K Plus
              price: 12500
              description: Almost brand new; used for only a month. No issues.
              location: Makati City
              images:
              - listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
      responses:
        '201':
          description: Created. The listing starts as `pending`.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Listing'
              example:
                success: true
                data:
                  _id: 665f1c2a9b1e4d0012a3b4c5
                  category: Processor
                  title: Intel Core Ultra 5 250K Plus
                  price: 12500
                  location: Makati City
                  images:
                  - listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  imageUrls:
                  - https://venta-uploads.s3.ap-southeast-1.amazonaws.com/listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  status: pending
                  createdAt: '2026-11-22T06:55:22.163Z'
                  updatedAt: '2026-11-22T07:20:31.203Z'
                  description: Almost brand new; used for only a month. No issues.
                  rejectionReason: null
                  userId: 665f1c2a9b1e4d0012a3b4a1
        '400':
          description: Validation failed, or an image key is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                descriptionTooShort:
                  summary: Description too short
                  value:
                    success: false
                    message: The description field must have at least 10 characters
                priceTooLow:
                  summary: Price below 1
                  value:
                    success: false
                    message: The price field must be at least 1
                noImages:
                  summary: No images
                  value:
                    success: false
                    message: The images field must have at least 1 items
                invalidKeys:
                  summary: Key outside your prefix
                  value:
                    success: false
                    message: Invalid image keys
        '401':
          $ref: '#/components/responses/Unauthorized'
  /listings/my-listings:
    get:
      tags:
      - Listings
      operationId: getMyListings
      summary: List my listings
      description: |-
        Returns all of the logged-in user's own listings in every status, newest first (an empty array if none).

        Rejected listings include the admin's `rejectionReason`. `userId` is the owner's id only, and `imageUrls` are public URLs built from the stored keys (not pre-signed).
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The caller's own listings in every status, newest first. Empty array if none.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Listing'
              example:
                success: true
                data:
                - _id: 665f1c2a9b1e4d0012a3b4c5
                  category: GPU
                  title: ASUS GeForce RTX 4070 Ti 12GB STRIX OC
                  price: 40000
                  location: Makati City
                  images:
                  - listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  imageUrls:
                  - https://venta-uploads.s3.ap-southeast-1.amazonaws.com/listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  status: rejected
                  createdAt: '2026-11-22T06:55:22.163Z'
                  updatedAt: '2026-11-22T07:20:31.203Z'
                  description: Almost brand new, used for only a month. No issues.
                  rejectionReason: Photos are too blurry, please retake them.
                  userId: 665f1c2a9b1e4d0012a3b4a1
                - _id: 665f1c2a9b1e4d0012a3b4c6
                  category: Processor
                  title: Ryzen 5 7600X
                  price: 8500
                  location: Pasig City
                  images:
                  - listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  imageUrls:
                  - https://venta-uploads.s3.ap-southeast-1.amazonaws.com/listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  status: available
                  createdAt: '2026-11-22T06:55:22.163Z'
                  updatedAt: '2026-11-22T07:20:31.203Z'
                  description: Almost brand new, used for only a month. No issues.
                  rejectionReason: null
                  userId: 665f1c2a9b1e4d0012a3b4a1
        '401':
          $ref: '#/components/responses/Unauthorized'
  /listings/{id}:
    get:
      tags:
      - Listings
      operationId: getListing
      summary: Get a listing
      description: |-
        Returns one listing by ID. Authentication is optional.

        ### Response

        `200` with the full listing: `userId` (populated as `{ _id, username }`), `category`, `title`, `price`, `description`, `location`, `images`, `imageUrls`, `status`, `rejectionReason` and timestamps.

        ### Visibility Rules

        | Listing status | Who can open it | Everyone else |
        | --- | --- | --- |
        | `available` | Anyone, including guests | n/a |
        | `pending`, `rejected`, `sold` | The owner and admins | `404` |

        ### Notes
