      description: |-
        Returns the message history, oldest first (an empty array if none). Participants only.

        History stays readable when the listing is pending, rejected, sold or deleted. Non-participants get `404`.
      security:
      - bearerAuth: []
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Message history, oldest first. Still readable when the listing is pending, rejected, sold or deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
              examples:
                messages:
                  summary: Messages
                  value:
                    success: true
                    data:
                    - _id: 665f1c2a9b1e4d0012a3b4e1
                      conversationId: 665f1c2a9b1e4d0012a3b4d1
                      senderId: 665f1c2a9b1e4d0012a3b4a2
                      content: Hello. Is the price still negotiable?
                      createdAt: '2026-11-22T06:55:22.163Z'
                      updatedAt: '2026-11-22T06:55:22.163Z'
                    - _id: 665f1c2a9b1e4d0012a3b4e2
                      conversationId: 665f1c2a9b1e4d0012a3b4d1
                      senderId: 665f1c2a9b1e4d0012a3b4a1
                      content: Yes, still available.
                      createdAt: '2026-11-22T07:20:31.203Z'
                      updatedAt: '2026-11-22T07:20:31.203Z'
                empty:
                  summary: No messages yet
                  value:
                    success: true
                    data: []
        '400':
          description: Malformed id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: The conversationId field format is invalid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Conversation missing, or the caller is not a participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Conversation not found
    post:
      tags:
      - Conversations
      operationId: sendMessage
      summary: Send a message
      description: |-
        Sends a message in a conversation. Both the buyer and the seller can send. Participants only.

        Messages are 1 to 1000 characters. Sending is allowed only while the listing is `available`. If the listing is pending, rejected, sold or deleted, the conversation stays readable but sending returns `409`. New messages appear on refresh (there is no real-time delivery).
      security:
      - bearerAuth: []
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              content: Hello. Is the price still negotiable?
      responses:
        '201':
          description: Message sent.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Message'
              example:
                success: true
                data:
                  _id: 665f1c2a9b1e4d0012a3b4e1
                  conversationId: 665f1c2a9b1e4d0012a3b4d1
                  senderId: 665f1c2a9b1e4d0012a3b4a2
                  content: Hello. Is the price still negotiable?
                  createdAt: '2026-11-22T06:55:22.163Z'
                  updatedAt: '2026-11-22T06:55:22.163Z'
        '400':
          description: Malformed id, or empty / over-long message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidId:
                  summary: Malformed id
                  value:
                    success: false
                    message: The conversationId field format is invalid
                empty:
                  summary: Empty message
                  value:
                    success: false
                    message: The content field must have at least 1 characters
                tooLong:
                  summary: Over 1000 characters
                  value:
                    success: false
                    message: The content field must not be greater than 1000 characters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Conversation missing, or the caller is not a participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Conversation not found
        '409':
          description: 'Sending is blocked: the listing is pending, rejected, sold or deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: This listing is no longer available for messaging
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ListingId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
      description: The listing id. A malformed id returns `400`.
  schemas:
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      example: 665f1c2a9b1e4d0012a3b4c5
      description: A MongoDB ObjectId as a 24-character hex string.
    Category:
      type: string
      enum:
      - Desktop
      - Processor
      - GPU
      - Motherboard
      - RAM
      - Storage
      - PSU
      - Cooler
      - Case
    ListingStatus:
      type: string
      enum:
      - pending
      - available
      - rejected
      - sold
      description: Lifecycle status. Only `available` listings are public.
    Error:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
          enum:
          - false
        message:
          type: string
          description: Human-readable error message.
    PublicUser:
      type: object
      required:
      - _id
      - username
      description: The only user identity other users can see. Email is never included.
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        username:
          type: string
          example: ventaseller
    AuthUser:
      type: object
      required:
      - _id
      - username
      - email
      - role
      description: The caller's own account. The email is returned to that user only.
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        username:
          type: string
          example: ventauser
        email:
          type: string
          format: email
          example: ventauser@example.com
        role:
          type: string
          enum:
          - user
          - admin
          description: A UI hint only. The server reads the role from the database on every request.
    AuthResult:
      type: object
      required:
      - user
      - token
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        token:
          type: string
          description: 'JWT. Send as `Authorization: Bearer <token>`.'
    RegisterRequest:
      type: object
      required:
      - username
      - email
      - password
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 15
          pattern: ^[a-z0-9_]+$
          description: Lowercase letters, numbers and underscores. Unique.
        email:
          type: string
          format: email
          description: Unique. Used to log in, never shown publicly.
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: Must differ from `currentPassword`.
    PresignRequest:
      type: object
      required:
      - files
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required:
            - contentType
            - size
            properties:
              contentType:
                type: string
                enum:
                - image/jpeg
                - image/png
                - image/webp
              size:
                type: integer
                minimum: 1
                maximum: 5242880
                description: File size in bytes. Max 5 MB (5,242,880).
    PresignedUpload:
      type: object
      required:
      - key
      - uploadUrl
      properties:
        key:
          type: string
          description: Server-generated S3 key under `listings/<userId>/`. Store this in the listing.
        uploadUrl:
          type: string
          description: Pre-signed URL for one `PUT`. Expires in 5 minutes.
    ListingBase:
      type: object
      required:
      - _id
      - category
      - title
      - price
      - location
      - images
      - imageUrls
      - status
      - createdAt
      - updatedAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        category:
          $ref: '#/components/schemas/Category'
        title:
          type: string
          maxLength: 100
        price:
          type: number
          minimum: 1
          description: Price in PHP.
        location:
          type: string
          maxLength: 100
        images:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
          description: S3 object keys.
        imageUrls:
          type: array
          items:
            type: string
          description: Public URLs built from `images`. Not pre-signed.
        status:
          $ref: '#/components/schemas/ListingStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ListingSummary:
      description: A browse card. Omits `description` and `rejectionReason`; the seller is populated.
      allOf:
      - $ref: '#/components/schemas/ListingBase'
      - type: object
        required:
        - userId
        properties:
          userId:
            $ref: '#/components/schemas/PublicUser'
    ListingDetail:
      description: A listing with the seller populated (public detail and admin queue).
      allOf:
      - $ref: '#/components/schemas/ListingBase'
      - type: object
        required:
        - description
        - rejectionReason
        - userId
        properties:
          description:
            type: string
            minLength: 10
            maxLength: 4000
          rejectionReason:
            type: string
            nullable: true
            maxLength: 500
            description: Set when an admin rejects; cleared when the seller resubmits.
          userId:
            $ref: '#/components/schemas/PublicUser'
    Listing:
      description: A listing as returned to its owner or after a write. `userId` is the seller id only.
      allOf:
      - $ref: '#/components/schemas/ListingBase'
      - type: object
        required:
        - description
        - rejectionReason
        - userId
        properties:
          description:
            type: string
            minLength: 10
            maxLength: 4000
          rejectionReason:
            type: string
            nullable: true
            maxLength: 500
          userId:
            $ref: '#/components/schemas/ObjectId'
    ListingCreate:
      type: object
      required:
      - category
      - title
      - price
      - description
      - location
      - images
      description: Fields not listed here (for example `status`, `userId`, `role`) are ignored.
      properties:
        category:
          $ref: '#/components/schemas/Category'
        title:
          type: string
          maxLength: 100
        price:
          type: number
          minimum: 1
          multipleOf: 0.01
          description: PHP, at most 2 decimal places.
        description:
          type: string
          minLength: 10
          maxLength: 4000
        location:
          type: string
          maxLength: 100
        images:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
          description: S3 keys from `POST /uploads/presign`, all under your own `listings/<userId>/` prefix.
    ListingUpdate:
      type: object
      minProperties: 1
      description: Send only the fields to change. `status` and `rejectionReason` are ignored if sent.
      properties:
        category:
          $ref: '#/components/schemas/Category'
        title:
          type: string
          maxLength: 100
        price:
          type: number
          minimum: 1
          multipleOf: 0.01
        description:
          type: string
          minLength: 10
          maxLength: 4000
        location:
          type: string
          maxLength: 100
        images:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
          description: The FULL list of keys. Photos removed from the list are deleted from S3.
    ReviewRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - available
          - rejected
        rejectionReason:
          type: string
          minLength: 5
          maxLength: 500
          description: Required when `status` is `rejected`.
    Pagination:
      type: object
      required:
      - page
      - limit
      - total
      - totalPages
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    Conversation:
      type: object
      description: A conversation with participant and listing ids only.
      required:
      - _id
      - listingId
      - buyerId
      - sellerId
      - lastMessage
      - lastMessageAt
      - createdAt
      - updatedAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        listingId:
          $ref: '#/components/schemas/ObjectId'
        buyerId:
          $ref: '#/components/schemas/ObjectId'
        sellerId:
          $ref: '#/components/schemas/ObjectId'
        lastMessage:
          type: string
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationInboxItem:
      type: object
      description: Inbox entry. `listingId` is `null` if the listing was deleted ("Listing no longer available").
      required:
      - _id
      - listingId
      - buyerId
      - sellerId
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        buyerId:
          $ref: '#/components/schemas/PublicUser'
        sellerId:
          $ref: '#/components/schemas/PublicUser'
        listingId:
          type: object
          nullable: true
          required:
          - _id
          - title
          - status
          properties:
            _id:
              $ref: '#/components/schemas/ObjectId'
            title:
              type: string
            status:
              $ref: '#/components/schemas/ListingStatus'
        lastMessage:
          type: string
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationDetail:
      type: object
      description: One conversation. `listingId` is `null` if the listing was deleted.
      required:
      - _id
      - listingId
      - buyerId
      - sellerId
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        buyerId:
          $ref: '#/components/schemas/PublicUser'
        sellerId:
          $ref: '#/components/schemas/PublicUser'
        listingId:
          type: object
          nullable: true
          required:
          - _id
          - title
          - price
          - status
          properties:
            _id:
              $ref: '#/components/schemas/ObjectId'
            title:
              type: string
            price:
              type: number
            status:
              $ref: '#/components/schemas/ListingStatus'
        lastMessage:
          type: string
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Message:
      type: object
      required:
      - _id
      - conversationId
      - senderId
      - content
      - createdAt
      - updatedAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        conversationId:
          $ref: '#/components/schemas/ObjectId'
        senderId:
          $ref: '#/components/schemas/ObjectId'
        content:
          type: string
          minLength: 1
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SendMessageRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
  responses:
    Unauthorized:
      description: Missing, invalid, expired or revoked token, or a token issued before the last password change.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingToken:
              summary: No token
              value:
                success: false
                message: Not authorized. No token provided.
            revokedToken:
              summary: Revoked token (after logout)
              value:
                success: false
                message: This token has been revoked. Please log in again.
            passwordChanged:
              summary: Token issued before a password change
              value:
                success: false
                message: Password recently changed. Please log in again.
    Forbidden:
      description: The caller is logged in but is not an admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Forbidden. You do not have permission to perform this action.
