    patch:
      tags:
      - Listings
      operationId: editListing
      summary: Edit my listing
      description: |-
        Updates the content of the owner's own listing.

        ### Status after editing

        | Current status | Result |
        | --- | --- |
        | `available` | Goes back to `pending` for re-review |
        | `rejected` | Goes back to `pending`, and `rejectionReason` is cleared |
        | `pending` | Stays `pending` |
        | `sold` | `409`. A sold listing cannot be edited |

        `status` and `rejectionReason` are ignored if sent. Only an admin decision, or the seller editing the listing, changes them.

        ### Response

        `200` with the updated listing.

        ### Notes
        - A listing that is missing or not yours returns `404` (the same response, so IDs do not leak). Admins cannot edit listings.
        - Invalid fields or invalid image keys return `400`. A missing token returns `401`.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingUpdate'
            examples:
              partial:
                summary: Change some fields
                value:
                  title: Ryzen 5 7600X (Boxed)
                  price: 8500
              replacePhotos:
                summary: Replace the photos (send the full list)
                value:
                  images:
                  - listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  - listings/665f1c2a9b1e4d0012a3b4a1/9a1d4c70-5b3e-4e28-8f6a-1c2d3e4f5a6b.webp
      responses:
        '200':
          description: Updated. An `available` or `rejected` listing returns to `pending`.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Listing'
              example:
                success: true
                data:
                  _id: 665f1c2a9b1e4d0012a3b4c5
                  category: Processor
                  title: Ryzen 5 7600X (Boxed)
                  price: 8500
                  location: Pasig City
                  images:
                  - listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  imageUrls:
                  - https://venta-uploads.s3.ap-southeast-1.amazonaws.com/listings/665f1c2a9b1e4d0012a3b4a1/3f6c1b9e-8a42-4d17-9c55-2b7e0a1d6f34.jpg
                  status: pending
                  createdAt: '2026-11-22T06:55:22.163Z'
                  updatedAt: '2026-11-22T07:20:31.203Z'
                  description: Almost brand new, used for only a month. No issues.
                  rejectionReason: null
                  userId: 665f1c2a9b1e4d0012a3b4a1
        '400':
          description: Empty body, validation failure, invalid image keys, or malformed id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                priceTooLow:
                  summary: Validation error
                  value:
                    success: false
                    message: The price field must be at least 1
                invalidKeys:
                  summary: Invalid images
                  value:
                    success: false
                    message: Invalid image keys
                invalidId:
                  summary: Malformed id
                  value:
                    success: false
                    message: The id field format is invalid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Listing missing, or not yours (same response so ids do not leak). Admins cannot edit listings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Listing not found
        '409':
          description: A sold listing cannot be edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: A sold listing can't be updated
    delete:
      tags:
      - Listings
      operationId: deleteListing
      summary: Delete a listing
      description: |-
        Permanently deletes a listing. The owner can delete their own listing, and an admin can delete any listing.

        ### Response

        `200` with `{ "success": true, "data": { "message": "Successfully deleted" } }`.

        ### What happens

        1. The listing is deleted from the database.

        2. Its photos are then deleted from S3. This is best-effort: a failure is logged and does not fail the request, so an orphaned S3 object is possible (an accepted MVP trade-off).

        3. Its conversations and messages are **kept**. They stay readable, the listing shows as `null`, and the UI shows "Listing no longer available". Sending in those conversations returns `409`.

        ### Notes
        - A listing that is missing or belongs to someone else returns `404` (the same response, so IDs do not leak). Admins are the exception and can delete any listing.
        - A missing token returns `401`.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    required:
                    - message
                    properties:
                      message:
                        type: string
              example:
                success: true
                data:
                  message: Successfully deleted
        '400':
          description: Malformed id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: The id field format is invalid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Listing missing, or not yours (admins can delete any listing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Listing not found
