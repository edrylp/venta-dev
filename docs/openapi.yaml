  /conversations/{id}:
    post:
      tags:
      - Conversations
      operationId: startConversation
      summary: Start (or reopen) a conversation about a listing
      description: |-
        Starts a conversation between the caller (the buyer) and the seller of a listing, or returns the caller's existing conversation for that listing. There is one conversation per buyer per listing.

        The `id` in the path is a **listing** id. `POST /conversations/{id}` and `GET /conversations/{id}` share a path template, but the id means a different thing in each.

        ### Rules

        - Messaging your own listing returns `400`.
        - A listing that is not `available` returns `409`, unless you already have a conversation for it, in which case that conversation is returned with `200` so you can read the history.
        - A new conversation returns `201`. If two requests race to create it, the second gets the existing conversation instead of an error.
        - The response has participant and listing ids only. Use `GET /conversations/{id}` for details.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
        description: The **listing** id (not a conversation id). The seller is taken from the listing, never from the client.
      responses:
        '200':
          description: The caller already had a conversation for this listing, so it is returned (even if the listing is no longer available, so history stays readable).
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Conversation'
              example:
                success: true
                data:
                  _id: 665f1c2a9b1e4d0012a3b4d1
                  listingId: 665f1c2a9b1e4d0012a3b4c5
                  buyerId: 665f1c2a9b1e4d0012a3b4a2
                  sellerId: 665f1c2a9b1e4d0012a3b4a1
                  lastMessage: null
                  lastMessageAt: null
                  createdAt: '2026-11-22T06:55:22.163Z'
                  updatedAt: '2026-11-22T06:55:22.163Z'
        '201':
          description: A new conversation was started.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Conversation'
              example:
                success: true
                data:
                  _id: 665f1c2a9b1e4d0012a3b4d1
                  listingId: 665f1c2a9b1e4d0012a3b4c5
                  buyerId: 665f1c2a9b1e4d0012a3b4a2
                  sellerId: 665f1c2a9b1e4d0012a3b4a1
                  lastMessage: null
                  lastMessageAt: null
                  createdAt: '2026-11-22T06:55:22.163Z'
                  updatedAt: '2026-11-22T06:55:22.163Z'
        '400':
          description: Malformed id, or the caller owns the listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ownListing:
                  summary: Own listing
                  value:
                    success: false
                    message: You can't message your own listing
                invalidId:
                  summary: Malformed id
                  value:
                    success: false
                    message: The listingId field format is invalid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Listing not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Listing not found
        '409':
          description: The listing is not `available` and the caller has no existing conversation for it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
